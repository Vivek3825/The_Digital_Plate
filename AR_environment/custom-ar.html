<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <title>Custom AR Viewer - The Digital Plate</title>
    <link rel="stylesheet" href="custom-ar.css">
    
    <!-- Three.js r128 (stable version with working GLTFLoader) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div class="ar-container">
        <button class="back-button" onclick="window.location.href='../index.html'">
            ← Back to Menu
        </button>

        <!-- Camera Feed -->
        <video id="video" autoplay playsinline></video>
        
        <!-- Canvas for 3D rendering on top of camera -->
        <canvas id="arCanvas"></canvas>
        
        <!-- Start AR Button -->
        <div id="startScreen" class="start-screen">
            <div class="start-content">
                <h1 id="modelTitle">View in AR</h1>
                <p class="description">Place this 3D model in your real environment using your camera</p>
                <button id="openCamera" class="start-ar-btn">
                    📷 Start AR Experience
                </button>
                <div class="features">
                    <div class="feature">✓ Camera feed integration</div>
                    <div class="feature">✓ Surface detection</div>
                    <div class="feature">✓ Gesture controls</div>
                </div>
            </div>
        </div>

        <!-- AR Controls Overlay -->
        <div id="arControls" class="ar-controls hidden">
            <div class="control-panel">
                <button class="control-icon-btn" id="resetBtn" title="Reset Position">
                    🔄
                </button>
                <button class="control-icon-btn" id="scaleUpBtn" title="Scale Up">
                    ➕
                </button>
                <button class="control-icon-btn" id="scaleDownBtn" title="Scale Down">
                    ➖
                </button>
                <button class="control-icon-btn" id="rotateBtn" title="Toggle Rotation">
                    🔁
                </button>
            </div>
            
            <div class="position-controls">
                <div class="position-info">
                    <span id="positionText">👇 Tap the green circle to place model</span>
                </div>
                <div class="gesture-hints" id="gestureHints">
                    <span>👆 Tap to place</span>
                    <span>🤏 Pinch to scale</span>
                    <span>🔄 Two fingers to rotate</span>
                    <span>↔️ Drag to move</span>
                </div>
            </div>

            <button class="exit-ar-btn" id="exitArBtn">
                ❌ Exit AR
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator hidden">
            <div class="spinner"></div>
            <p>Loading 3D Model...</p>
        </div>
    </div>

    <script src="custom-ar.js"></script>
</body>
</html>
