<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <title>Custom AR Viewer - The Digital Plate</title>
    <link rel="stylesheet" href="custom-ar.css">
    
    <!-- Three.js r128 (stable version with working GLTFLoader) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div class="ar-container">
        <!-- Camera Feed -->
        <video id="video" autoplay playsinline></video>
        
        <!-- Canvas for 3D rendering on top of camera -->
        <canvas id="arCanvas"></canvas>
        
        <!-- Loading Indicator (shown initially) -->
        <div id="loadingIndicator" class="loading-indicator">
            <div class="spinner"></div>
            <p>Initializing AR Experience...</p>
        </div>

        <!-- Start AR Button -->
        <div id="startArButton" class="start-ar-button hidden">
            <button id="startArBtn" class="ar-start-btn">
                🚀 Start AR Experience
            </button>
        </div>

        <!-- AR Controls Overlay -->
        <div id="arControls" class="ar-controls hidden">
            <div class="control-panel">
                <button class="control-icon-btn" id="resetBtn" title="Reset Position">
                    🔄
                </button>
                <button class="control-icon-btn" id="scaleUpBtn" title="Scale Up">
                    ➕
                </button>
                <button class="control-icon-btn" id="scaleDownBtn" title="Scale Down">
                    ➖
                </button>
                <button class="control-icon-btn" id="rotateBtn" title="Toggle Rotation">
                    🔁
                </button>
                <button class="control-icon-btn" id="infoToggleBtn" title="Toggle Info">
                    ℹ️
                </button>
            </div>
            
            <!-- Futuristic Holographic Info Panel -->
            <div id="holoInfoPanel" class="holo-info-panel hidden">
                <div class="holo-container">
                    <!-- Scanning Line Effect -->
                    <div class="holo-scan-line"></div>
                    
                    <!-- Corner Decorations -->
                    <div class="holo-corner holo-corner-tl"></div>
                    <div class="holo-corner holo-corner-tr"></div>
                    <div class="holo-corner holo-corner-bl"></div>
                    <div class="holo-corner holo-corner-br"></div>
                    
                    <!-- Main Info Content -->
                    <div class="holo-content">
                        <div class="holo-header">
                            <div class="holo-icon">◈</div>
                            <h2 id="holoDishName" class="holo-title">Loading...</h2>
                            <div class="holo-status">
                                <span class="status-dot"></span>
                                <span>ANALYZING</span>
                            </div>
                        </div>
                        
                        <div class="holo-divider"></div>
                        
                        <div class="holo-section">
                            <div class="holo-label">
                                <span class="label-icon">🧬</span>
                                <span>INGREDIENTS</span>
                            </div>
                            <p id="holoIngredients" class="holo-data">—</p>
                        </div>
                        
                        <div class="holo-section">
                            <div class="holo-label">
                                <span class="label-icon">⚡</span>
                                <span>NUTRIENTS</span>
                            </div>
                            <p id="holoNutrients" class="holo-data">—</p>
                        </div>
                    </div>
                    
                    <!-- Floating Particles -->
                    <div class="holo-particles">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
            
            <div class="position-controls">
                <div class="position-info">
                    <span id="positionText">👇 Tap the green circle to place model</span>
                </div>
            </div>

            <button class="exit-ar-btn" id="exitArBtn">
                ❌ Exit AR
            </button>
        </div>
    </div>

    <script src="custom-ar.js"></script>
</body>
</html>
