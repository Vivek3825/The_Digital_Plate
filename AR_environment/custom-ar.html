<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <title>Custom AR Viewer - The Digital Plate</title>
    <link rel="stylesheet" href="custom-ar.css">
    
    <!-- Three.js r128 (stable version with working GLTFLoader) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div class="ar-container">
        <!-- Camera Feed -->
        <video id="video" autoplay playsinline></video>
        
        <!-- Canvas for 3D rendering on top of camera -->
        <canvas id="arCanvas"></canvas>
        
        <!-- Loading Indicator (shown initially) -->
        <div id="loadingIndicator" class="loading-indicator">
            <div class="spinner"></div>
            <p>Initializing AR Experience...</p>
        </div>

        <!-- AR Controls Overlay -->
        <div id="arControls" class="ar-controls hidden">
            <div class="control-panel">
                <button class="control-icon-btn" id="resetBtn" title="Reset Position">
                    🔄
                </button>
                <button class="control-icon-btn" id="scaleUpBtn" title="Scale Up">
                    ➕
                </button>
                <button class="control-icon-btn" id="scaleDownBtn" title="Scale Down">
                    ➖
                </button>
                <button class="control-icon-btn" id="rotateBtn" title="Toggle Rotation">
                    🔁
                </button>
            </div>
            
            <div class="position-controls">
                <div class="position-info">
                    <span id="positionText">👇 Tap the green circle to place model</span>
                </div>
            </div>

            <button class="exit-ar-btn" id="exitArBtn">
                ❌ Exit AR
            </button>
        </div>
    </div>

    <script src="custom-ar.js"></script>
</body>
</html>
